<!doctype html>
<html lang="ar" dir="rtl" manifest="cache.appcache">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>RAW GAME</title>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400;1,700&family=Space+Mono&display=swap');

      html, body {
        margin: 0;
        padding: 0;
        min-height: 100%;
        background: #050505;
        color: #ffffff;
        font-family: 'Cairo', 'Playfair Display', Georgia, serif;
        overflow: hidden;
        height: 100vh;
        width: 100vw;
      }

      /* --- Brand Header --- */
      #brand {
        position: absolute;
        top: 30px;
        right: 50px;
        left: auto;
        display: flex;
        align-items: center;
        z-index: 10;
        text-align: right;
        padding: 0;
        background: transparent;
        border: none;
      }
      #brand b {
        font-family: 'Cairo', sans-serif;
        font-size: 24px;
        font-weight: 700;
        color: #ffffff;
        letter-spacing: normal;
        vertical-align: middle;
      }

      /* --- Background Shapes --- */
      .bg-shapes {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        z-index: 1;
        pointer-events: none;
        overflow: hidden;
        direction: ltr;
      }
      .shape { position: absolute; }
      .zigzag { top: 50px; left: 45%; width: 120px; height: 40px; }
      .triangle-solid {
        top: 10%; left: 15%;
        width: 0; height: 0;
        border-left: 150px solid transparent;
        border-right: 150px solid transparent;
        border-bottom: 260px solid #ffffff;
      }
      .triangle-checker {
        top: -20px; left: -20px;
        width: 200px; height: 200px;
        background-image: 
          linear-gradient(45deg, #fff 25%, transparent 25%), 
          linear-gradient(-45deg, #fff 25%, transparent 25%), 
          linear-gradient(45deg, transparent 75%, #fff 75%), 
          linear-gradient(-45deg, transparent 75%, #fff 75%);
        background-size: 20px 20px;
        background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
        clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
        opacity: 0.8;
      }
      .triangle-hollow-container {
        bottom: 5%; left: 10%;
        width: 350px; height: 350px;
      }
      .triangle-hollow {
        width: 0; height: 0;
        border-left: 175px solid transparent;
        border-right: 175px solid transparent;
        border-bottom: 300px solid transparent;
        position: absolute; bottom: 0; right: 0;
      }
      .triangle-hollow::after {
        content: '';
        position: absolute; top: 3px; left: -175px;
        width: 0; height: 0;
        border-left: 175px solid transparent;
        border-right: 175px solid transparent;
        border-bottom: 300px solid #ffffff;
        clip-path: polygon(50% 0%, 0% 100%, 100% 100%, 50% 5%);
      }
      .diagonal-lines {
        position: absolute; top: 0; right: -50px;
        width: 200px; height: 200px;
        background: repeating-linear-gradient(-45deg, #ffffff, #ffffff 2px, transparent 2px, transparent 12px);
        clip-path: polygon(100% 0, 100% 100%, 0 100%);
      }
      .small-triangle {
        top: 60%; right: 45%;
        width: 0; height: 0;
        border-left: 40px solid transparent;
        border-right: 40px solid transparent;
        border-bottom: 70px solid #ffffff;
      }
      .square-hollow {
        bottom: 10%; left: 25%;
        width: 30px; height: 30px;
        border: 2px solid #ffffff;
      }
      .square-checker {
        bottom: 5%; left: 5%;
        width: 50px; height: 50px;
        background-image: 
          linear-gradient(45deg, #555 25%, transparent 25%), 
          linear-gradient(-45deg, #555 25%, transparent 25%), 
          linear-gradient(45deg, transparent 75%, #555 75%), 
          linear-gradient(-45deg, transparent 75%, #555 75%);
        background-size: 10px 10px;
        background-position: 0 0, 0 5px, 5px -5px, -5px 0px;
      }
      .small-gray-triangle {
        bottom: 12%; left: 15%;
        width: 0; height: 0;
        border-left: 50px solid transparent;
        border-right: 50px solid transparent;
        border-bottom: 80px solid #888888;
      }

      /* ===================== Face Loader ===================== */
      /* مؤشر التحميل القديم مخفي احتياطياً فقط */
      #spin { display: none !important; }

      .fl-face-wrap {
        position: fixed;
        top: 50%;
        left: 50%;
        width: 150px;
        height: 150px;
        margin: -75px 0 0 -75px;
        z-index: 10;
      }

      .fl-face {
        width: 100%;
        height: auto;
        display: block;
        overflow: visible;
        --px: 0px; --py: 0px; --ps: 1;
      }
      .fl-face[data-state="right"]  { --px: 9px;  --py: 1px; }
      .fl-face[data-state="left"]   { --px: -9px; --py: 1px; }
      .fl-face[data-state="gasp"]   { --ps: .55; }
      .fl-face[data-state="scream"] { --ps: .6; }

      .fl-faceg, .fl-eye, .fl-pupils, .fl-brow, .fl-mouth, .fl-tongue, .fl-ring {
        transform-box: fill-box;
        transform-origin: center;
      }

      .fl-ball  { fill: #ffffff; stroke: #050505; stroke-width: 4; }
      .fl-pupil { fill: #050505; }
      .fl-glint { fill: #ffffff; }
      .fl-brow, .fl-smile, .fl-lid { fill: none; stroke: #050505; stroke-width: 5.5; stroke-linecap: round; }
      .fl-mouth { fill: #050505; }
      .fl-tongue { fill: #8c8c8c; opacity: 0; transition: opacity .2s .1s; }
      .fl-ring { fill: none; stroke: #ffffff; stroke-width: 2; opacity: 0; }

      .fl-faceg { transition: transform .45s cubic-bezier(.34,1.4,.5,1); }
      .fl-face[data-state="right"]  .fl-faceg { transform: translateX(4px) rotate(4deg); }
      .fl-face[data-state="left"]   .fl-faceg { transform: translateX(-4px) rotate(-4deg); }
      .fl-face[data-state="gasp"]   .fl-faceg { transform: scale(.96); }
      .fl-face[data-state="scream"] .fl-faceg { animation: fl-shake .1s linear infinite; }
      .fl-face[data-state="smile"]  .fl-faceg,
      .fl-face[data-state="wink"]   .fl-faceg { transform: rotate(-4deg) scale(1.02); }

      @keyframes fl-shake {
        0%,100% { transform: translate(0,0) scale(1.07) rotate(0); }
        25%     { transform: translate(-2.5px,1.5px) scale(1.07) rotate(-1.5deg); }
        50%     { transform: translate(2px,-1.5px) scale(1.07) rotate(1deg); }
        75%     { transform: translate(-1.5px,-1px) scale(1.07) rotate(-1deg); }
      }

      .fl-pupils { transform: translate(var(--px), var(--py)) scale(var(--ps)); transition: transform .32s cubic-bezier(.3,1.5,.5,1); }
      .fl-eye { transition: transform .25s, opacity .12s; }
      .fl-face[data-state="gasp"]   .fl-eye { transform: scale(1.12); }
      .fl-face[data-state="scream"] .fl-eye { transform: scaleY(.5); }
      .fl-face[data-state="wink"]   .fl-eR  { transform: scaleY(.06); opacity: 0; transition: transform .12s ease-in, opacity .12s; }

      .fl-lid { opacity: 0; transition: opacity .1s .05s; }
      .fl-face[data-state="wink"] .fl-lid { opacity: 1; }

      .fl-brow { transition: transform .3s cubic-bezier(.3,1.5,.5,1); }
      .fl-face[data-state="gasp"]   .fl-brow { transform: translateY(-6px); }
      .fl-face[data-state="scream"] .fl-bL   { transform: translateY(-4px) rotate(10deg); }
      .fl-face[data-state="scream"] .fl-bR   { transform: translateY(-4px) rotate(-10deg); }
      .fl-face[data-state="smile"]  .fl-brow { transform: translateY(-2px); }
      .fl-face[data-state="wink"]   .fl-bL   { transform: translateY(-3px); }
      .fl-face[data-state="wink"]   .fl-bR   { transform: translateY(5px); }

      .fl-mouth { transition: transform .3s cubic-bezier(.3,1.5,.5,1), opacity .2s; }
      .fl-face[data-state="right"]  .fl-mouth { transform: translateX(3px); }
      .fl-face[data-state="left"]   .fl-mouth { transform: translateX(-3px); }
      .fl-face[data-state="gasp"]   .fl-mouth { transform: scale(.65, 3.6); }
      .fl-face[data-state="scream"] .fl-mouth { transform: scale(1.55, 11); }
      .fl-face[data-state="scream"] .fl-tongue { opacity: 1; }
      .fl-face[data-state="smile"]  .fl-mouth,
      .fl-face[data-state="wink"]   .fl-mouth { opacity: 0; }

      .fl-smile { opacity: 0; transition: opacity .2s; }
      .fl-face[data-state="smile"] .fl-smile,
      .fl-face[data-state="wink"]  .fl-smile { opacity: 1; }

      .fl-face[data-state="scream"] .fl-ring { animation: fl-ring 1.1s ease-out backwards; }
      .fl-face[data-state="scream"] .fl-ring:nth-of-type(2) { animation-delay: .18s; }
      .fl-face[data-state="scream"] .fl-ring:nth-of-type(3) { animation-delay: .36s; }

      @keyframes fl-ring {
        0%   { transform: scale(1);   opacity: .55; }
        100% { transform: scale(2.1); opacity: 0; }
      }

      @media (prefers-reduced-motion: reduce) {
        .fl-face[data-state="scream"] .fl-faceg,
        .fl-face[data-state="scream"] .fl-ring { animation: none; }
      }

      /* --- Messages --- */
      #msg {
        position: fixed;
        top: 50%;
        left: 0;
        right: 0;
        transform: translateY(-50%);
        text-align: center;
        font-size: 3rem;
        font-weight: 700;
        font-family: 'Cairo', sans-serif;
        color: #ffffff;
        display: none;
        z-index: 10;
      }

      #success-msg {
        position: fixed;
        top: 50%;
        left: 0;
        right: 0;
        transform: translateY(-50%);
        text-align: center;
        font-size: 3.5rem;
        font-weight: 700;
        font-family: 'Cairo', sans-serif;
        color: #7fd0a0;
        display: none;
        z-index: 10;
      }

      #wrap {
        position: absolute;
        top: 50%;
        right: 50px;
        left: auto;
        transform: translateY(-40%);
        width: 60%;
        max-width: 800px;
        z-index: 10;
        padding: 0;
        text-align: right;
      }
      #state, #out { display: none; }

      /* --- State Management (متوافق مع jb.js) --- */
      body.done .fl-face-wrap { display: none; }
      body.done #success-msg { display: block; }

      body.fail .fl-face-wrap { display: none; }
      body.fail #msg { display: block; }

      body.log .fl-face-wrap,
      body.log #msg,
      body.log #success-msg { display: none; }
      body.log #wrap { padding: 0; }
      body.log #state {
        display: block;
        font-size: 2rem;
        font-weight: 700;
        margin: 0 0 15px 0;
        color: #ffffff;
      }
      body.log #out {
        display: block;
        white-space: pre-wrap;
        font: 13px/1.8 'Cairo', monospace;
        background: #0a0a0a;
        border: 1px solid #222222;
        border-radius: 5px;
        padding: 20px;
        height: calc(100vh - 200px);
        overflow-y: auto;
        color: #a0a0a0;
        direction: ltr;
        text-align: left;
      }

      .ok { color: #7fd0a0; }
      .bad { color: #d08a7f; }
      .warn { color: #d8c07f; }
      .safe { color: #7fd0a0; }
      .danger { color: #d08a7f; }
      code { color: #9fb3d0; }

      @media (max-width: 768px) {
        #wrap { width: 90%; right: 5%; top: 40%; }
        #msg { font-size: 2rem; }
        #success-msg { font-size: 2.2rem; }
        .fl-face-wrap { width: 120px; height: 120px; margin: -60px 0 0 -60px; }
        .triangle-solid { border-width: 80px 80px 140px 80px; left: 5%; top: 20%; }
        .triangle-checker { width: 120px; height: 120px; }
        .triangle-hollow-container { transform: scale(0.6); transform-origin: bottom left; }
        .small-triangle { display: none; }
        #brand { right: 20px; top: 20px; }
        #brand b { font-size: 18px; }
      }
    </style>
  </head>
  <body>
    <!-- Background Shapes -->
    <div class="bg-shapes">
      <svg class="shape zigzag" viewBox="0 0 100 40" preserveAspectRatio="none">
        <polyline points="0,30 25,5 50,30 75,5 100,30" fill="none" stroke="#ffffff" stroke-width="2"/>
      </svg>
      <div class="shape triangle-solid"></div>
      <div class="shape triangle-checker"></div>
      <div class="shape small-triangle"></div>
      <div class="shape triangle-hollow-container">
        <div class="triangle-hollow"></div>
        <div class="diagonal-lines"></div>
      </div>
      <div class="shape small-gray-triangle"></div>
      <div class="shape square-hollow"></div>
      <div class="shape square-checker"></div>
    </div>

    <!-- Brand Header -->
    <div id="brand">
      <b>تم التطوير بواسطة نايل الحربي</b>
    </div>

    <!-- المؤشر القديم مخفي احتياطياً فقط -->
    <div id="spin"></div>

    <!-- الوجه المتحرك الجديد -->
    <div class="fl-face-wrap">
      <svg class="fl-face" id="fl-face" viewBox="0 0 200 200" data-state="idle" role="img" aria-label="Loading">
        <defs>
          <radialGradient id="flg" cx="40%" cy="32%" r="80%">
            <stop offset="0" stop-color="#ffffff"/>
            <stop offset="1" stop-color="#cfcfcf"/>
          </radialGradient>
        </defs>
        <g>
          <circle class="fl-ring" cx="100" cy="100" r="84"/>
          <circle class="fl-ring" cx="100" cy="100" r="84"/>
          <circle class="fl-ring" cx="100" cy="100" r="84"/>
        </g>
        <g class="fl-faceg">
          <circle cx="100" cy="100" r="84" fill="url(#flg)"/>
          <path class="fl-brow fl-bL" d="M54 64Q70 57 86 63"/>
          <path class="fl-brow fl-bR" d="M114 63Q130 57 146 64"/>
          <g class="fl-eye" id="fl-eL">
            <ellipse class="fl-ball" cx="72" cy="90" rx="17" ry="20"/>
            <g class="fl-pupils">
              <circle class="fl-pupil" cx="72" cy="90" r="7.5"/>
              <circle class="fl-glint" cx="74.5" cy="87" r="2.2"/>
            </g>
          </g>
          <g class="fl-eye fl-eR">
            <ellipse class="fl-ball" cx="128" cy="90" rx="17" ry="20"/>
            <g class="fl-pupils">
              <circle class="fl-pupil" cx="128" cy="90" r="7.5"/>
              <circle class="fl-glint" cx="130.5" cy="87" r="2.2"/>
            </g>
          </g>
          <path class="fl-lid" d="M112 92Q128 76 144 92"/>
          <ellipse class="fl-mouth" cx="100" cy="138" rx="11" ry="2.2"/>
          <ellipse class="fl-tongue" cx="100" cy="154" rx="9" ry="5"/>
          <path class="fl-smile" d="M74 126Q100 158 126 126"/>
        </g>
      </svg>
    </div>

    <!-- Messages -->
    <div id="msg">أعد تشغيل جهازك</div>
    <div id="success-msg">تم تفعيل القولد هين بنجاح!</div>

    <!-- Log/Wrap -->
    <div id="wrap">
      <div id="state"></div>
      <div id="out"></div>
    </div>

    <script>
      /* ===== Face Loader (يتزامن مع body classes التي يضبطها jb.js) ===== */
      (function () {
        var body = document.body;
        var face = document.getElementById("fl-face");
        if (!face) return;

        var live = true, idx = 0, timer = null;
        var winkTimer = null, screamTimer = null;

        var STEPS = [
          ["right", 1000], ["idle", 280], ["left", 1200], ["idle", 380],
          ["gasp", 420], ["scream", 1400], ["idle", 900]
        ];

        function set(s) { face.setAttribute("data-state", s); }

        function tick() {
          if (!live) return;
          var step = STEPS[idx % STEPS.length];
          set(step[0]);
          idx++;
          timer = setTimeout(tick, step[1]);
        }

        function stop() {
          live = false;
          clearTimeout(timer);
          timer = null;
        }

        function runLoop() {
          stop();
          clearTimeout(winkTimer);
          clearTimeout(screamTimer);
          live = true;
          idx = 0;
          set("idle");
          timer = setTimeout(tick, 600);
        }

        function doneState() {
          stop();
          clearTimeout(screamTimer);
          set("smile");
          clearTimeout(winkTimer);
          winkTimer = setTimeout(function () { set("wink"); }, 600);
        }

        function failState() {
          stop();
          clearTimeout(winkTimer);
          set("scream");
          clearTimeout(screamTimer);
          screamTimer = setTimeout(function () { set("idle"); }, 1500);
        }

        var lastState = null;

        function apply() {
          var s = "idle";
          if (body.classList.contains("done")) s = "done";
          else if (body.classList.contains("fail")) s = "fail";
          else if (body.classList.contains("log")) s = "log";

          if (s === lastState) return;
          lastState = s;

          if (s === "done")      doneState();
          else if (s === "fail") failState();
          else if (s === "log")  stop();     /* الوجه مخفي بالـ CSS هنا */
          else                   runLoop();
        }

        var obs = new MutationObserver(apply);
        obs.observe(body, { attributes: true, attributeFilter: ["class"] });

        apply();
      })();
    </script>

    <script type="module">
      import "./jb.js?v=10";
    </script>
  </body>
</html>
