<!doctype html>
<html lang="en" manifest="cache.appcache">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>RAW GAME</title>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400;1,700&family=Space+Mono&display=swap');

      html, body {
        margin: 0;
        padding: 0;
        min-height: 100%;
        background: #050505;
        color: #ffffff;
        font-family: 'Playfair Display', Georgia, serif;
        overflow: hidden;
        height: 100vh;
        width: 100vw;
      }

      /* --- Brand Header (NAYIL ALHRBI) --- */
      #brand {
        position: absolute;
        top: 40px;
        left: 50px;
        font-family: 'Space Mono', monospace;
        font-size: 14px;
        letter-spacing: 0.2em;
        color: #a0a0a0;
        display: flex;
        align-items: center;
        z-index: 10;
        text-align: left;
        padding: 0;
        background: transparent;
        border: none;
      }
      #brand img { display: none; }
      #brand::before {
        content: '';
        display: inline-block;
        width: 10px;
        height: 10px;
        background: #ffffff;
        border-radius: 50%;
        margin-right: 15px;
      }
      #brand b {
        font-size: 14px;
        font-weight: 400;
        letter-spacing: 0.2em;
        color: #a0a0a0;
        vertical-align: middle;
      }

      /* --- Background Shapes --- */
      .bg-shapes {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        z-index: 1;
        pointer-events: none;
        overflow: hidden;
      }
      .shape { position: absolute; }
      .zigzag { top: 50px; left: 55%; width: 120px; height: 40px; }
      .triangle-solid {
        top: 10%; right: 15%;
        width: 0; height: 0;
        border-left: 150px solid transparent;
        border-right: 150px solid transparent;
        border-bottom: 260px solid #ffffff;
      }
      .triangle-checker {
        top: -20px; right: -20px;
        width: 200px; height: 200px;
        background-image: 
          linear-gradient(45deg, #fff 25%, transparent 25%), 
          linear-gradient(-45deg, #fff 25%, transparent 25%), 
          linear-gradient(45deg, transparent 75%, #fff 75%), 
          linear-gradient(-45deg, transparent 75%, #fff 75%);
        background-size: 20px 20px;
        background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
        clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
        opacity: 0.8;
      }
      .triangle-hollow-container {
        bottom: 5%; right: 10%;
        width: 350px; height: 350px;
      }
      .triangle-hollow {
        width: 0; height: 0;
        border-left: 175px solid transparent;
        border-right: 175px solid transparent;
        border-bottom: 300px solid transparent;
        position: absolute; bottom: 0; right: 0;
      }
      .triangle-hollow::after {
        content: '';
        position: absolute; top: 3px; left: -175px;
        width: 0; height: 0;
        border-left: 175px solid transparent;
        border-right: 175px solid transparent;
        border-bottom: 300px solid #ffffff;
        clip-path: polygon(50% 0%, 0% 100%, 100% 100%, 50% 5%);
      }
      .diagonal-lines {
        position: absolute; top: 0; right: -50px;
        width: 200px; height: 200px;
        background: repeating-linear-gradient(-45deg, #ffffff, #ffffff 2px, transparent 2px, transparent 12px);
        clip-path: polygon(100% 0, 100% 100%, 0 100%);
      }
      .small-triangle {
        top: 60%; left: 45%;
        width: 0; height: 0;
        border-left: 40px solid transparent;
        border-right: 40px solid transparent;
        border-bottom: 70px solid #ffffff;
      }
      .square-hollow {
        bottom: 10%; right: 25%;
        width: 30px; height: 30px;
        border: 2px solid #ffffff;
      }
      .square-checker {
        bottom: 5%; right: 5%;
        width: 50px; height: 50px;
        background-image: 
          linear-gradient(45deg, #555 25%, transparent 25%), 
          linear-gradient(-45deg, #555 25%, transparent 25%), 
          linear-gradient(45deg, transparent 75%, #555 75%), 
          linear-gradient(-45deg, transparent 75%, #555 75%);
        background-size: 10px 10px;
        background-position: 0 0, 0 5px, 5px -5px, -5px 0px;
      }
      .small-gray-triangle {
        bottom: 12%; right: 15%;
        width: 0; height: 0;
        border-left: 50px solid transparent;
        border-right: 50px solid transparent;
        border-bottom: 80px solid #888888;
      }

      /* --- Functional Elements (Spinner & Message) --- */
      #spin {
        position: fixed;
        top: 50%;
        left: 50%;
        width: 60px;
        height: 60px;
        margin: -30px 0 0 -30px;
        border: 4px solid #333333;
        border-top-color: #ffffff;
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
        z-index: 10;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }

      #msg {
        position: fixed;
        top: 50%;
        left: 0;
        right: 0;
        transform: translateY(-50%);
        text-align: center;
        font-size: 2.5rem;
        font-style: italic;
        font-family: 'Playfair Display', serif;
        color: #ffffff;
        letter-spacing: 0.02em;
        display: none;
        z-index: 10;
      }

      #wrap {
        position: absolute;
        top: 50%;
        left: 50px;
        transform: translateY(-40%);
        width: 60%;
        max-width: 800px;
        z-index: 10;
        padding: 0;
      }
      #state, #out { display: none; }

      /* State Management from jb.js */
      body.done #spin { display: none; }
      body.fail #spin { display: none; }
      body.fail #msg { display: block; }

      /* Log View */
      body.log #spin, body.log #msg { display: none; }
      body.log #wrap { padding: 0; }
      body.log #state {
        display: block;
        font-size: 2rem;
        font-weight: 700;
        font-style: italic;
        margin: 0 0 15px 0;
        color: #ffffff;
      }
      body.log #out {
        display: block;
        white-space: pre-wrap;
        font: 12px/1.6 'Space Mono', monospace;
        background: #0a0a0a;
        border: 1px solid #222222;
        border-radius: 5px;
        padding: 20px;
        height: calc(100vh - 200px);
        overflow-y: auto;
        color: #a0a0a0;
      }

      /* Status Colors */
      .ok { color: #7fd0a0; }
      .bad { color: #d08a7f; }
      .warn { color: #d8c07f; }
      .safe { color: #7fd0a0; }
      .danger { color: #d08a7f; }
      code { color: #9fb3d0; }

      @media (max-width: 768px) {
        #wrap { width: 90%; left: 5%; top: 40%; }
        #msg { font-size: 1.8rem; }
        .triangle-solid { border-width: 80px 80px 140px 80px; right: 5%; top: 20%; }
        .triangle-checker { width: 120px; height: 120px; }
        .triangle-hollow-container { transform: scale(0.6); transform-origin: bottom right; }
        .small-triangle { display: none; }
        #brand { left: 20px; top: 20px; }
      }
    </style>
  </head>
  <body>
    <!-- Background Shapes -->
    <div class="bg-shapes">
      <svg class="shape zigzag" viewBox="0 0 100 40" preserveAspectRatio="none">
        <polyline points="0,30 25,5 50,30 75,5 100,30" fill="none" stroke="#ffffff" stroke-width="2"/>
      </svg>
      <div class="shape triangle-solid"></div>
      <div class="shape triangle-checker"></div>
      <div class="shape small-triangle"></div>
      <div class="shape triangle-hollow-container">
        <div class="triangle-hollow"></div>
        <div class="diagonal-lines"></div>
      </div>
      <div class="shape small-gray-triangle"></div>
      <div class="shape square-hollow"></div>
      <div class="shape square-checker"></div>
    </div>
