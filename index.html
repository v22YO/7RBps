<!DOCTYPE html>
<html lang="ar" dir="rtl" manifest="cache.appcache">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RAW GAME</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400;1,700&family=Space+Mono&display=swap');

  html, body { 
    margin: 0; 
    padding: 0; 
    background: #050505; 
    color: #ffffff;
    font-family: 'Cairo', 'Playfair Display', Georgia, serif;
    overflow: hidden;
    height: 100vh;
    width: 100vw;
  }

  /* --- الشريط العلوي --- */
  #brand { 
    position: absolute;
    top: 30px;
    right: 50px; /* محاذاة لليمين */
    left: auto;
    display: flex;
    align-items: center;
    z-index: 10;
    text-align: right;
    padding: 0;
    background: transparent;
    border: none;
  }

  #brand b { 
    font-family: 'Cairo', sans-serif;
    font-size: 24px;
    font-weight: 700;
    color: #ffffff; 
    letter-spacing: normal;
  }

  /* الحاوية الرئيسية للنصوص وحالة النظام */
  #wrap { 
    position: absolute;
    top: 50%;
    right: 50px; /* محاذاة لليمين */
    left: auto;
    transform: translateY(-40%);
    width: 60%;
    max-width: 800px;
    z-index: 10;
    padding: 0;
    text-align: right;
  }

  /* النصوص الثابتة */
  .static-title {
    font-size: 5.5rem;
    font-weight: 700;
    margin: 0 0 10px 0;
    line-height: 1;
    color: #ffffff;
    font-family: 'Playfair Display', serif; /* إبقاء اسم Redium بالإنجليزية */
    direction: ltr;
    text-align: right;
  }

  .static-subtitle {
    font-size: 3rem;
    font-weight: 700;
    margin: 0 0 40px 0;
    color: #888888;
    line-height: 1.2;
  }

  .static-desc {
    font-size: 1.4rem;
    font-weight: 400;
    color: #666666;
    line-height: 1.6;
    margin: 0 0 30px 0;
  }

  /* حالة النظام (ديناميكية) */
  #state { 
    font-size: 1.2rem; 
    font-weight: 700; 
    margin: 0 0 10px 0; 
    color: #ffffff;
    font-family: 'Cairo', sans-serif;
  }
  
  #det { 
    font-family: 'Space Mono', 'Cairo', monospace;
    font-size: 14px; 
    color: #888888; 
    margin: 0 0 5px 0; 
    direction: rtl;
  }
  #det b { 
    color: #cccccc; 
    font-weight: 600; 
  }
  
  #cache { 
    font-family: 'Cairo', sans-serif;
    font-size: 13px; 
    color: #444444; 
    margin: 0; 
    min-height: 14px; 
  }
  #cache.cacheok { color: #7fd0a0; }

  /* ألوان الحالة */
  .ok { color: #7fd0a0 !important; } 
  .bad { color: #d08a7f !important; } 
  .warn { color: #d8c07f !important; }

  /* --- الأشكال الهندسية الخلفية --- */
  .bg-shapes {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    z-index: 1;
    pointer-events: none;
    overflow: hidden;
    direction: ltr; /* لضمان عدم تأثر الأشكال باتجاه الصفحة */
  }

  .shape { position: absolute; }

  .zigzag { top: 50px; left: 45%; width: 120px; height: 40px; }

  .triangle-solid {
    top: 10%; left: 15%; /* نقل الأشكال لليسار لترك مساحة للنص العربي */
    width: 0; height: 0;
    border-left: 150px solid transparent;
    border-right: 150px solid transparent;
    border-bottom: 260px solid #ffffff;
  }

  .triangle-checker {
    top: -20px; left: -20px;
    width: 200px; height: 200px;
    background-image: 
      linear-gradient(45deg, #fff 25%, transparent 25%), 
      linear-gradient(-45deg, #fff 25%, transparent 25%), 
      linear-gradient(45deg, transparent 75%, #fff 75%), 
      linear-gradient(-45deg, transparent 75%, #fff 75%);
    background-size: 20px 20px;
    background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
    clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
    opacity: 0.8;
  }

  .triangle-hollow-container {
    bottom: 5%; left: 10%;
    width: 350px; height: 350px;
  }
  .triangle-hollow {
    width: 0; height: 0;
    border-left: 175px solid transparent;
    border-right: 175px solid transparent;
    border-bottom: 300px solid transparent;
    position: absolute; bottom: 0; right: 0;
  }
  .triangle-hollow::after {
    content: '';
    position: absolute; top: 3px; left: -175px;
    width: 0; height: 0;
    border-left: 175px solid transparent;
    border-right: 175px solid transparent;
    border-bottom: 300px solid #ffffff;
    clip-path: polygon(50% 0%, 0% 100%, 100% 100%, 50% 5%);
  }
  .diagonal-lines {
    position: absolute; top: 0; right: -50px;
    width: 200px; height: 200px;
    background: repeating-linear-gradient(-45deg, #ffffff, #ffffff 2px, transparent 2px, transparent 12px);
    clip-path: polygon(100% 0, 100% 100%, 0 100%);
  }

  .small-triangle {
    top: 60%; right: 45%;
    width: 0; height: 0;
    border-left: 40px solid transparent;
    border-right: 40px solid transparent;
    border-bottom: 70px solid #ffffff;
  }

  .square-hollow {
    bottom: 10%; left: 25%;
    width: 30px; height: 30px;
    border: 2px solid #ffffff;
  }
  
  .square-checker {
    bottom: 5%; left: 5%;
    width: 50px; height: 50px;
    background-image: 
      linear-gradient(45deg, #555 25%, transparent 25%), 
      linear-gradient(-45deg, #555 25%, transparent 25%), 
      linear-gradient(45deg, transparent 75%, #555 75%), 
      linear-gradient(-45deg, transparent 75%, #555 75%);
    background-size: 10px 10px;
    background-position: 0 0, 0 5px, 5px -5px, -5px 0px;
  }

  .small-gray-triangle {
    bottom: 12%; left: 15%;
    width: 0; height: 0;
    border-left: 50px solid transparent;
    border-right: 50px solid transparent;
    border-bottom: 80px solid #888888;
  }

  @media (max-width: 768px) {
    #wrap { width: 90%; right: 5%; top: 40%; }
    .static-title { font-size: 3.5rem; }
    .static-subtitle { font-size: 2rem; }
    .static-desc { font-size: 1rem; }
    .triangle-solid { border-width: 80px 80px 140px 80px; left: 5%; top: 20%; }
    .triangle-checker { width: 120px; height: 120px; }
    .triangle-hollow-container { transform: scale(0.6); transform-origin: bottom left; }
    .small-triangle { display: none; }
    #brand { right: 20px; top: 20px; }
    #brand b { font-size: 18px; }
  }
</style>
</head>
<body>

  <div class="bg-shapes">
    <svg class="shape zigzag" viewBox="0 0 100 40" preserveAspectRatio="none">
      <polyline points="0,30 25,5 50,30 75,5 100,30" fill="none" stroke="#ffffff" stroke-width="2"/>
    </svg>
    <div class="shape triangle-solid"></div>
    <div class="shape triangle-checker"></div>
    <div class="shape small-triangle"></div>
    <div class="shape triangle-hollow-container">
      <div class="triangle-hollow"></div>
      <div class="diagonal-lines"></div>
    </div>
    <div class="shape small-gray-triangle"></div>
    <div class="shape square-hollow"></div>
    <div class="shape square-checker"></div>
  </div>

  <!-- الشريط العلوي -->
  <div id="brand">
    <b>تم التطوير بواسطة نايل الحربي</b>
  </div>

  <div id="wrap">
    <div class="static-title">Redium</div>
    <div class="static-subtitle">سير عمل الروت</div>
    <div class="static-desc">
      اكتشف تعديلات ممتعة ومنظور جديد<br>
      — للألعاب التي تحبها.
    </div>

    <div id="state">جاري اكتشاف النظام...</div>
    <div id="det"></div>
    <div id="cache"></div>
  </div>

<script>
(function () {
    var stateEl = document.getElementById("state");
    var detEl = document.getElementById("det");
    var cacheEl = document.getElementById("cache");
    function setState(t, c) { stateEl.textContent = t; stateEl.className = c || ""; }
    function setCache(t, ok) { cacheEl.textContent = t; cacheEl.className = ok ? "cacheok" : ""; }
    var params = new URLSearchParams(location.search);

    var SUPPORTED = { 1302: 1, 1304: 1, 1350: 1, 1352: 1 };

    var key = null, fwnum = null;
    var m = /PlayStation\s+4[\/ ](\d+)\.(\d+)/.exec(navigator.userAgent);
    if (m) {
        var ms = parseInt(m[2], 16).toString(16);
        if (ms.length < 2) ms = "0" + ms;
        key = m[1] + "." + ms;
        fwnum = parseInt(m[1], 10) * 100 + parseInt(ms, 10);
    }

    var forced = params.get("force") === "1";
    var supported = forced || (fwnum !== null && SUPPORTED[fwnum] === 1);
    
    // تعريب رسالة النظام
    detEl.innerHTML = "النظام <b>" + (key || "غير معروف") + "</b>"
        + (supported ? " &middot; <b>مدعوم</b>"
                     : " &middot; غير مدرج في جدول النواة لهذا الإصدار");

    var target = "jb.html" + location.search;
    function go() { setState("جاري تحميل الجيلبريك...", "warn"); location.replace(target); }

    function waitForTap(msg, action) {
        setState(msg, "warn");
        function fire() {
            window.removeEventListener("click", fire);
            window.removeEventListener("keydown", fire);
            action();
        }
        window.addEventListener("click", fire);
        window.addEventListener("keydown", fire);
    }

    if (!supported) {
        setState("نظام غير مدعوم", "bad");
        waitForTap("غير مدعوم (" + (key || "غير معروف") + ") -- اضغط X أو انقر للتشغيل على أي حال", go);
        return;
    }

    var ac = window.applicationCache;
    if (!ac || !document.documentElement.hasAttribute("manifest")) {
        go();
    } else if (!navigator.onLine) {
        setCache("دون اتصال -- من الذاكرة المؤقتة", true);
        go();
    } else if (ac.status === ac.IDLE) {
        setCache("تم التخزين", true);
        go();
    } else if (ac.status === ac.UPDATEREADY) {
        try { ac.swapCache(); } catch (e) {}
        setCache("تم تنزيل التحديث", true);
        waitForTap("التحديث جاهز -- اضغط X أو انقر لإعادة التحميل والتشغيل",
                   function () { location.reload(); });
    } else {
        setCache("جاري فحص الذاكرة المؤقتة...");
        ac.addEventListener("downloading",
            function () { setCache("جاري التخزين للاستخدام دون اتصال (التشغيل الأول)..."); }, false);
        ac.addEventListener("progress", function (e) {
            if (e && e.total)
                setCache("جاري التخزين " + Math.round((e.loaded / e.total) * 100) + "%");
        }, false);
        ac.addEventListener("cached", function () {
            setCache("تم التخزين للاستخدام دون اتصال", true);
            waitForTap("تم التخزين (التشغيل الأول) -- اضغط X أو انقر للتشغيل", go);
        }, false);
        ac.addEventListener("updateready", function () {
            try { ac.swapCache(); } catch (e) {}
            setCache("تم تنزيل التحديث", true);
            waitForTap("التحديث جاهز -- اضغط X أو انقر لإعادة التحميل والتشغيل",
                       function () { location.reload(); });
        }, false);
        ac.addEventListener("noupdate", function () {
            setCache("مخزن -- جاهز دون اتصال", true);
            go();
        }, false);
        ac.addEventListener("error", function () {
            setCache("الذاكرة المؤقتة غير متاحة");
            waitForTap("فشل التخزين المؤقت -- اضغط X أو انقر للتشغيل على أي حال", go);
        }, false);
        ac.addEventListener("obsolete", function () {
            setCache("الذاكرة المؤقتة قديمة");
            waitForTap("الذاكرة المؤقتة قديمة -- اضغط X أو انقر للتشغيل", go);
        }, false);
    }
})();
</script>
</body>
</html>
